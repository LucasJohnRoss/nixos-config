[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.0
capsule = true
capsule_border = "on_surface"
capsule_border_width = 1.5
capsule_fill = "surface"
capsule_foreground = "on_surface"
capsule_padding = 7.0
capsule_radius = 0
capsule_thickness = 0.99999998137354851
end = [ "group:g1", "group:g2", "group:g3", "group:g4", "tray", "group:g5" ]
font_family = "JetBrainsMono Nerd Font"
font_weight = 600
margin_ends = 0
padding = 12
radius = 0
start = [ "workspaces", "active_window" ]
thickness = 26
widget_spacing = 3

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "on_surface"
    border_width = 1.5
    enabled = true
    fill = "surface"
    foreground = "on_surface"
    id = "g1"
    members = [ "input_volume", "output_volume" ]
    opacity = 1.0
    padding = 7.0
    radius = 0.0
    widget_spacing = 4

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "on_surface"
    border_width = 1.5
    enabled = true
    fill = "surface"
    foreground = "on_surface"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 7.0
    radius = 0.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "on_surface"
    border_width = 1.5
    enabled = true
    fill = "surface"
    foreground = "on_surface"
    id = "g3"
    members = [ "brightness", "battery", "power_profile" ]
    opacity = 1.0
    padding = 7.0
    radius = 0.0
    widget_spacing = 4

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "on_surface"
    border_width = 1.5
    enabled = true
    fill = "surface"
    foreground = "on_surface"
    id = "g4"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 7.0
    radius = 0.0
    widget_spacing = 5

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "on_surface"
    border_width = 1.5
    enabled = true
    fill = "surface"
    foreground = "on_surface"
    id = "g5"
    members = [ "notifications", "session", "control-center" ]
    opacity = 1.0
    padding = 7.0
    radius = 0.0
    widget_spacing = 5

[bluetooth]
connection_notifications = true

[control_center]
circular_avatar = false
hidden_tabs = [ "system", "weather", "calendar" ]
shortcuts = []
show_avatar_border = false
show_session_button = false
sidebar = "full"
sidebar_section = "none"

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    locked_timeout = 30.0
    timeout = 660.0

    [idle.behavior.suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 1800.0

[lockscreen]
blur_intensity = 0.0
enabled = true
fingerprint = false
lock_before_suspend = true
transition = [ "stripes" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = false
        show_login_button = false
        show_media = false
        show_password_reveal = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
clipboard_auto_paste = "off"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_expand_all_groups = true
settings_window_translucent = true
show_close_buttons = false
time_format = "{:%H:%M:%S}"

    [shell.launcher]
    auto_paste = "off"
    categories = false
    compact = true
    layout = "simple"

    [shell.panel]
    control_center_position = "top_right"
    open_near_click_control_center = true
    session_position = "top_center"

    [shell.screenshot]
    directory = "~/Images/Screenshots"
    show_region_dimensions = false

    [shell.session]
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "ghostty" ]

[wallpaper]
directory = "~/Images/Wallpapers"
enabled = true
transition = [ "fade" ]

[weather]
enabled = false

[widget.clock]
anchor = true
format = "{:%a %d/%m/%Y %H:%M:%S}"

[widget.control-center]
glyph = "brand-snowflake"

[widget.network]
show_label = false
vpn_status = "both"

[widget.tray]
detached_panel = true
drawer = true

[widget.workspaces]
active_pill_size = 1.5
focused_output_only = true
inactive_pill_size = 1.5
show_all_outputs = true
