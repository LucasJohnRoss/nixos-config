# --- Keybinds ---

#Change Prefix keys to Ctrl+Tab
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'
unbind C-b
set -g prefix C-Tab
bind C-Tab send-prefix

#Prefix Leader Keys - each enters its own key table
bind-key s switch-client -T Sessions
bind-key w switch-client -T Windows
bind-key t switch-client -T Tabs

#Sessions - <Prefix> s ...
bind-key -T Sessions d detach-client
bind-key -T Sessions r command-prompt -I "#S" "rename-session -- '%%'"
bind-key -T Sessions l choose-tree -Zs
bind-key -T Sessions n command-prompt -p "New session name:" "new-session -s '%%'"
bind-key -T Sessions q kill-session

#Panes=Windows - <Prefix> w ...
bind-key -T Windows s split-window -v
bind-key -T Windows v split-window -h
bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U
bind-key -T Windows q kill-pane

#Windows=Tabs - <Prefix> t ...
bind-key -T Tabs n new-window
bind-key -T Tabs r command-prompt -I "#W" "rename-window -- '%%'"
bind-key -T Tabs q kill-window

# --- General ---

#Window and Pane Index Starts at 1
set -g base-index 1
setw -g pane-base-index 1
#Windows Not Renamed Automatically
set-option -g allow-rename off
set -g mouse on   

# --- Status Line ---
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-position top
#bg=default is what makes the bar transparent
set -g status-style 'bg=default,fg=#ffffff'

#Left: session name, prefix indicator, active key table
set -g status-left-length 40
set -g status-left '#[fg=#ffffff,bold] #S #[default]#{?client_prefix,● ,}#{?#{!=:#{client_key_table},root},[#{client_key_table}] ,}'

#Right: hostname
set -g status-right-length 40
set -g status-right '#[fg=#ffffff] #H '

#Window list - active window in crimson
setw -g window-status-separator ''
setw -g window-status-format '#[fg=#ffffff] #I:#W '
setw -g window-status-current-format '#[fg=#dc143c,bold] #I:#W '
setw -g window-status-activity-style 'fg=#ffffff'
